services:
  postgres:
    image: postgres:17-alpine
    container_name: mailbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate database used by the integration tests.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox -d mailbox"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
